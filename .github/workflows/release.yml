name: Release

on:
  push:
    # Recommended trigger: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
    tags:
      - "v*"
    # Also allowed: push to these branches builds a rolling pre-release. Remove if not needed.
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a GitHub Release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build (linux amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o surfconv-linux-amd64 .
          sha256sum surfconv-linux-amd64 > surfconv-linux-amd64.sha256

      - name: Build (linux arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o surfconv-linux-arm64 .
          sha256sum surfconv-linux-arm64 > surfconv-linux-arm64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            surfconv-linux-amd64
            surfconv-linux-amd64.sha256
            surfconv-linux-arm64
            surfconv-linux-arm64.sha256
          # A tag push -> normal release; a branch push -> rolling pre-release named "latest"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build (pre-release)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
